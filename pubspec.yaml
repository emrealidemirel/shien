name: shien
description: "Çevrimdışı kullanım ve hesaba bağlı bulut senkronizasyonu sunan kişisel hatırlatıcı."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.8.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon/app_icon.png" 
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#365C9C"
  adaptive_icon_foreground: assets/app_icon/adaptive_foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/app_icon/adaptive_monochrome.png
  web:
    generate: true
    background_color: "#F6F7F9"
    theme_color: "#365C9C"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^19.4.2
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_localizations:
    sdk: flutter
  timezone: ^0.10.1
  permission_handler: ^12.0.3
  audioplayers: ^6.8.1
  flutter_timezone: ^5.1.0
  file_picker: ^13.3.0
  home_widget: ^0.10.0
  path_provider: ^2.1.6
  easy_localization: ^3.0.8
  firebase_core: ^4.15.2
  firebase_auth: ^6.7.1
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.5.0
  image_picker: ^1.2.4

dev_dependencies:
  shared_preferences: ^2.5.6
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-Manrope.txt
    - assets/fonts/OFL-PatrickHand.txt
    - assets/app_icon/brand_mark.png
    - assets/sounds/
    - assets/translations/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
